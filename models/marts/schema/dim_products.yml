models:
  - name: dim_products
    description: Dimensão de produtos contendo informações cadastrais, classificação, características e valores dos produtos.
    columns:
      - name: pk_product
        description: Chave primária da dimensão de produtos.
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: Nome do produto.
      - name: product_number
        description: Código de identificação do produto.
      - name: product_color
        description: Cor do produto.
      - name: product_size
        description: Tamanho do produto.
      - name: subcategory_name
        description: Nome da subcategoria à qual o produto pertence.
      - name: category_name
        description: Nome da categoria à qual o produto pertence.
      - name: standard_cost
        description: Custo padrão do produto.
      - name: list_price
        description: Preço de venda de tabela do produto.
      - name: sell_start_date
        description: Data de início da comercialização do produto.