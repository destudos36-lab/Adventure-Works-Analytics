models:
  - name: dim_credit_cards
    description: Dimensão de cartões de crédito contendo informações sobre os tipos de cartões utilizados pelos clientes.
    columns:
      - name: pk_credit_card
        description: Chave primária da dimensão de cartões de crédito.
        data_tests:
          - unique
          - not_null
      - name: card_type
        description: Tipo ou bandeira do cartão de crédito.