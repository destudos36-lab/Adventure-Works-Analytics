models:
  - name: stg_erp_product_category
    description: "Tabela de categorias de produtos, utilizada para organizar e classificar os produtos cadastrados."

    columns:
      - name: pk_product_category
        description: "Chave primária que identifica unicamente cada categoria de produto."
        data_tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Nome da categoria que identifica a classificação dos produtos."
        data_tests:
          - not_null